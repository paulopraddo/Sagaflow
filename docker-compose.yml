name: sagaflow

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
  ConnectionStrings__rabbitmq: amqp://guest:guest@rabbitmq:5672

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sagaflow
      POSTGRES_PASSWORD: sagaflow
    ports: ["5433:5432"] # 5433 on the host to avoid clashing with a local PostgreSQL
    volumes:
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagaflow"]
      interval: 5s
      retries: 10

  # MassTransit's image ships RabbitMQ with the delayed-message exchange plugin enabled,
  # which backs saga timeouts and delayed redelivery.
  rabbitmq:
    image: masstransit/rabbitmq:4.3.1
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # Grafana + Tempo (traces) + Loki (logs) + Prometheus (metrics) behind one OTLP endpoint.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    volumes:
      - lgtm-data:/data
      - ./deploy/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/sagaflow.yaml:ro
      - ./deploy/grafana/dashboards:/otel-lgtm/sagaflow-dashboards:ro

  catalog:
    build:
      context: .
      args:
        PROJECT: src/Services/Catalog/Sagaflow.Catalog.Api
    environment:
      <<: *service-env
      ConnectionStrings__catalog: Host=postgres;Database=catalog;Username=sagaflow;Password=sagaflow
    ports: ["5101:8080"]
    depends_on: *service-deps

  inventory:
    build:
      context: .
      args:
        PROJECT: src/Services/Inventory/Sagaflow.Inventory.Api
    environment:
      <<: *service-env
      ConnectionStrings__inventory: Host=postgres;Database=inventory;Username=sagaflow;Password=sagaflow
    ports: ["5103:8080"]
    depends_on: *service-deps

  payments:
    build:
      context: .
      args:
        PROJECT: src/Services/Payments/Sagaflow.Payments.Api
    environment:
      <<: *service-env
      ConnectionStrings__payments: Host=postgres;Database=payments;Username=sagaflow;Password=sagaflow
      PaymentGateway__DeclineAmountAbove: 1000
    ports: ["5104:8080"]
    depends_on: *service-deps

  orders:
    build:
      context: .
      args:
        PROJECT: src/Services/Orders/Sagaflow.Orders.Api
    environment:
      <<: *service-env
      ConnectionStrings__orders: Host=postgres;Database=orders;Username=sagaflow;Password=sagaflow
      OrderSaga__PaymentTimeout: "00:00:30"
    ports: ["5102:8080"]
    depends_on: *service-deps

  gateway:
    build:
      context: .
      args:
        PROJECT: src/Gateway/Sagaflow.Gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: http://catalog:8080
      ReverseProxy__Clusters__orders__Destinations__primary__Address: http://orders:8080
      ReverseProxy__Clusters__inventory__Destinations__primary__Address: http://inventory:8080
      ReverseProxy__Clusters__payments__Destinations__primary__Address: http://payments:8080
    ports: ["5000:8080"]
    depends_on: [catalog, orders, inventory, payments]

volumes:
  postgres-data:
  lgtm-data:
